<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Test Site</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f6f8fa;
      color: #24292f;
      margin: 0;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
    }
    main {
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
      padding: 2rem 2.5rem;
      max-width: 480px;
      text-align: center;
    }
    h1 { margin-top: 0; }
    button {
      background: #1f883d;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.6rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #1a7f37; }
    #message { margin-top: 1rem; min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, GitHub! 👋</h1>
    <p>If you can see this page, your repository and hosting are working.</p>
    <button id="btn">Click me</button>
    <p id="message"></p>
  </main>

  <script>
    document.getElementById("btn").addEventListener("click", function () {
      document.getElementById("message").textContent =
        "Success! JavaScript is running too. " + new Date().toLocaleString();
    });
  </script>
</body>
</html>
